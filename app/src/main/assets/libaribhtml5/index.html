<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html, body, #viewport { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #viewport { position: relative; contain: layout style size; }
    #broadcast {
      position: absolute;
      left: 0;
      top: 0;
      border: 0;
      transform-origin: top left;
      background: transparent;
      will-change: transform;
      contain: strict;
    }
    #status {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(16, 18, 22, 0.84);
      color: rgba(255, 255, 255, 0.92);
      font: 500 20px/1.3 sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    #status.ready, #status:empty { display: none; }
  </style>
  <script src="/libaribhtml5/libaribhtml5.js"></script>
</head>
<body>
  <div id="viewport">
    <iframe id="broadcast"></iframe>
    <div id="status">データ放送を受信中…</div>
  </div>
  <script>
    (() => {
      const iframe = document.querySelector('#broadcast');
      const viewport = document.querySelector('#viewport');
      const status = document.querySelector('#status');
      let currentEntry = '';
      let currentUrlIsBlank = false;
      let lastVisibleUrl = '';
      let lastPlaneJson = '';
      let lastStatusText = 'データ放送を受信中…';
      let runtimeInstalled = false;
      let autoEnterData = false;
      const pendingKeys = [];
      const receiverSystemInformation = {
        makerid: 'Honorebi',
        modelname: 'Honorebi Android TV',
        decoder: 'native',
      };

      const setOverlayMessage = (displayText, nativeLogText = displayText) => {
        const text = String(displayText || '');
        if (text !== lastStatusText) {
          lastStatusText = text;
          status.textContent = text;
        }
        if (nativeLogText && window.ARIBNative?.onStatus) {
          window.ARIBNative.onStatus(String(nativeLogText));
        }
      };

      const mediaPlaneAdapter = {
        renderMode: 'external',
        mountMediaPlane(_object, plane) { this.updateMediaPlane(_object, plane); },
        updateMediaPlane(_object, plane) {
          if (!window.ARIBNative?.onMediaPlane) return;
          const serialized = JSON.stringify(plane);
          if (serialized === lastPlaneJson) return;
          lastPlaneJson = serialized;
          window.ARIBNative.onMediaPlane(serialized);
        },
        unmountMediaPlane(reason) {
          lastPlaneJson = '';
          if (window.ARIBNative?.onMediaPlaneUnmounted) {
            window.ARIBNative.onMediaPlaneUnmounted(String(reason));
          }
        },
      };

      const allowExternalNetwork = Boolean(window.ARIBNative?.allowExternalNetwork?.());
      const receiverInfo = (() => {
        try {
          const raw = window.ARIBNative?.receiverInfoJson?.();
          if (!raw) return undefined;
          const parsed = JSON.parse(raw);
          return {
            zipcode: typeof parsed.zipcode === 'string' && /^\d{7}$/.test(parsed.zipcode) ? parsed.zipcode : null,
            prefecture: typeof parsed.prefecture === 'number' ? parsed.prefecture : null,
            regioncode: typeof parsed.regioncode === 'number' ? parsed.regioncode : null,
          };
        } catch {
          return undefined;
        }
      })();

      const host = new window.ARIBHTML5.AribReceiverHost({
        iframe,
        viewport,
        mediaPlaneAdapter,
        broadcastBaseUrl: '/data-broadcast/',
        supportedMedia: ['6', '7'],
        getInputSource() {
          const source = window.ARIBNative?.inputSource?.();
          return source === 'onair' || source === 'recorded' ? source : null;
        },
        allowExternalNetwork,
        receiverInfo,
        getDeviceIdentifier: async () => null,
        systemInformation: receiverSystemInformation,
        onStatus(value) {
          if (value && window.ARIBNative?.onStatus) {
            window.ARIBNative.onStatus(String(value));
          }
        },
        onLifecycle(event) {
          if (event.type === 'installed') {
            runtimeInstalled = true;
            status.classList.add('ready');
            // The browser host no longer claims keyboard input globally. The
            // native TV overlay owns remote input while it is visible, so opt
            // the receiver application into input before flushing queued keys.
            host.setApplicationInputActive(true);
            for (const code of pendingKeys.splice(0)) host.dispatchKey(code);
            if (autoEnterData) {
              autoEnterData = false;
              host.dispatchKey(keyCodes.data);
            }
          }
          if (event.type === 'loading' || event.type === 'navigating') {
            runtimeInstalled = false;
            status.classList.remove('ready');
            setOverlayMessage('データ放送を読み込み中…', '');
          }
          if (event.type === 'exited') {
            runtimeInstalled = false;
            lastPlaneJson = '';
            pendingKeys.splice(0);
            if (window.ARIBNative?.onApplicationExited) {
              window.ARIBNative.onApplicationExited();
            }
          }
          if (event.type === 'error' || event.type === 'frame-blocked' ||
              event.type === 'navigation-blocked') {
            const detail = event.message || event.type;
            console.error('[HonorebiB60] lifecycle error:', detail);
            status.classList.remove('ready');
            setOverlayMessage('データ放送を表示できませんでした', 'lifecycle-error: ' + detail);
          }
        },
        onUrlChange(value) {
          const url = String(value || '');
          const pathSegments = new URL(url || '/', window.location.origin).pathname.split('/');
          currentUrlIsBlank = pathSegments.some(
            segment => segment.toLowerCase() === 'startup'
          );
          if (url && !currentUrlIsBlank) lastVisibleUrl = url;
          if (window.ARIBNative?.onUrlChanged) window.ARIBNative.onUrlChanged(url);
        },
        onOpenProgramGuide(request) {
          if (!window.ARIBNative?.openProgramGuide) return false;
          return Boolean(window.ARIBNative.openProgramGuide(JSON.stringify(request)));
        },
      });

      window.__ARIB_HTML5_INSTALL__ = target => host.installRuntime(target);

      const keyCodes = {
        left: 37, up: 38, right: 39, down: 40, enter: 13, back: 461, data: 457,
        red: 403, green: 404, yellow: 405, blue: 406,
        '0': 48, '1': 49, '2': 50, '3': 51, '4': 52,
        '5': 53, '6': 54, '7': 55, '8': 56, '9': 57,
      };

      function applyProgramInfo(programInfo) {
        if (programInfo?.start_time !== undefined) {
          programInfo.start_time = new Date(programInfo.start_time);
        }
        if (programInfo?.f_start_time !== undefined) {
          programInfo.f_start_time = new Date(programInfo.f_start_time);
        }
        if (programInfo) host.setProgramInfo(programInfo);
      }

      function applyBroadcastClock(broadcastClock) {
        if (broadcastClock) {
          broadcastClock.currentMediaTimeSeconds = () =>
            Number(window.ARIBNative?.currentMediaTimeSeconds?.() || 0);
          host.setBroadcastClock(broadcastClock);
        }
      }

      function applyMetadata(payload) {
        applyProgramInfo(payload.programInfo);
        applyBroadcastClock(payload.broadcastClock);
      }

      window.KomorebiB60 = {
        start(json) {
          const payload = JSON.parse(json);
          if (!payload.entryPath) return false;
          host.clearProgramInfo();
          host.clearBroadcastClock();
          host.setLctBackgroundColor(payload.lctBackgroundColorRgb ?? null);
          host.setApplicationInformation(payload.application ?? null);
          applyMetadata(payload);
          currentEntry = String(payload.entryPath).replace(/^\/+/, '');
          currentUrlIsBlank = false;
          lastVisibleUrl = '';
          lastPlaneJson = '';
          autoEnterData = Boolean(payload.autoEnterData);
          status.classList.remove('ready');
          setOverlayMessage('データ放送を読み込み中…', '');
          host.loadApplication('/' + currentEntry);
          return true;
        },
        updateProgramInfo(json) {
          applyProgramInfo(JSON.parse(json));
          return true;
        },
        updateBroadcastClock(json) {
          applyBroadcastClock(JSON.parse(json));
          return true;
        },
        updateLctBackgroundColor(value) {
          host.setLctBackgroundColor(value ?? null);
          return true;
        },
        resourceChanged(path, updated) {
          if (currentEntry && updated) {
            host.notifyDataResource('/' + String(path).replace(/^\/+/, ''), 'updated');
          }
          return true;
        },
        exit() {
          currentEntry = '';
          lastPlaneJson = '';
          host.exitApplication();
          host.clearProgramInfo();
          host.clearBroadcastClock();
          status.classList.add('ready');
          setOverlayMessage('', '');
          return true;
        },
      };

      window.KomorebiDataBroadcastingRemote = {
        press(key) {
          const name = String(key);
          const code = keyCodes[name];
          if (code === undefined) return false;
          if (name === 'data' && currentUrlIsBlank && lastVisibleUrl) {
            runtimeInstalled = false;
            status.classList.remove('ready');
            setOverlayMessage('データ放送を読み込み中…', '');
            host.loadApplication(lastVisibleUrl);
            return true;
          }
          if (!runtimeInstalled) {
            pendingKeys.push(code);
            return true;
          }
          host.setApplicationInputActive(true);
          host.dispatchKey(code);
          return true;
        },
      };

      window.addEventListener('error', event => {
        console.error('[HonorebiB60] error:', event.message);
        if (window.ARIBNative?.onStatus) window.ARIBNative.onStatus('error: ' + event.message);
      });
      window.addEventListener('unhandledrejection', event => {
        const msg = String(event.reason?.message || event.reason);
        console.error('[HonorebiB60] unhandledrejection:', msg);
        if (window.ARIBNative?.onStatus) window.ARIBNative.onStatus('rejection: ' + msg);
      });
    })();
  </script>
</body>
</html>
