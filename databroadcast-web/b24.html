<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html, body, #viewport {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    #viewport {
      position: relative;
      contain: layout style size;
    }
    #bml-container {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--bml-browser-width, 960px);
      height: var(--bml-browser-height, 540px);
      transform-origin: center center;
      transform: translate(-50%, -50%) scale(var(--bml-scale-x, 1), var(--bml-scale-y, 1));
      will-change: transform;
      overflow: hidden;
    }
    #bml-container.invisible {
      display: none;
    }
    #status {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(16, 18, 22, 0.84);
      color: rgba(255, 255, 255, 0.92);
      font: 500 20px/1.3 sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    #status.ready, #status:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="bml-container"></div>
    <div id="status">データ放送を受信中…</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
