<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <style>
    html, body, #viewport { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #viewport { position: relative; contain: layout style size; }
    #broadcast {
      position: absolute;
      left: 0;
      top: 0;
      border: 0;
      transform-origin: top left;
      background: transparent;
      will-change: transform;
      contain: strict;
    }
    #status {
      position: absolute;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      padding: 10px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(16, 18, 22, 0.84);
      color: rgba(255, 255, 255, 0.92);
      font: 500 20px/1.3 sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }
    #status.ready, #status:empty { display: none; }
  </style>
</head>
<body>
  <div id="viewport">
    <iframe id="broadcast"></iframe>
    <div id="status">データ放送を受信中…</div>
  </div>
  <script type="module" src="/src/b60.ts"></script>
</body>
</html>
